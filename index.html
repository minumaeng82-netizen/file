<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>나만의 인생 스티커 만들기 체험 부스</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS (WebRTC P2P 직접 전송) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 text-slate-800 select-none">

  <!-- =========================================================
       1. 운영자 태블릿 모드 (기본 접속 화면)
  ========================================================== -->
  <div id="tablet-view" class="hidden w-full max-w-2xl bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden transition-all">
    <div class="bg-gradient-to-r from-indigo-600 to-violet-600 px-6 py-5 text-white flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-xs font-semibold tracking-wider uppercase text-indigo-100">Liene PixCut S1 Kiosk</span>
        </div>
        <h1 class="text-xl sm:text-2xl font-bold mt-0.5">나만의 인생 스티커 만들기 체험 부스</h1>
      </div>
      <div class="text-right">
        <span id="connection-badge" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-white/15 text-white backdrop-blur-sm">
          준비 중...
        </span>
      </div>
    </div>

    <div class="p-6 sm:p-10">
      <!-- [상태 A] QR 코드 대기 화면 -->
      <div id="tablet-waiting" class="flex flex-col items-center text-center">
        <div class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-full text-sm font-semibold mb-6">
          📱 부스 핫스팟 연결 후, 스마트폰 카메라로 QR을 스캔하세요
        </div>

        <div class="relative p-5 bg-white rounded-3xl shadow-lg border-2 border-indigo-100 mb-6">
          <div id="qrcode" class="w-56 h-56 sm:w-64 sm:h-64 flex items-center justify-center"></div>
        </div>

        <p class="text-slate-600 text-sm max-w-md mb-2">
          별도의 앱 없이 사진을 태블릿으로 즉시 전송할 수 있습니다.
        </p>

        <div class="mt-8 pt-4 border-t border-slate-100 w-full text-center">
          <p class="text-sm font-bold text-slate-500">문원 AI디지털 교육연구회</p>
        </div>
      </div>

      <!-- [상태 B] 사진 수신 완료 화면 -->
      <div id="tablet-received" class="hidden flex flex-col items-center text-center">
        <div class="inline-flex items-center gap-2 bg-emerald-100 text-emerald-800 px-4 py-1.5 rounded-full text-sm font-bold mb-4">
          <span>✨ 사진이 안전하게 도착했습니다!</span>
        </div>

        <div class="relative w-full max-w-sm bg-slate-900 rounded-2xl overflow-hidden shadow-lg border-4 border-white mb-6">
          <img id="received-image" src="" alt="수신된 사진" class="w-full max-h-80 object-contain mx-auto bg-slate-800" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-md">
          <button id="btn-download" class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-4 px-5 rounded-2xl shadow-md transition">
            <span>💾 태블릿에 사진 저장</span>
          </button>
          <button id="btn-next-photo" class="flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-4 px-5 rounded-2xl shadow-md transition">
            <span>🔄 새로운 사진 받기</span>
          </button>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-100 w-full text-center">
          <p class="text-sm font-bold text-slate-500">문원 AI디지털 교육연구회</p>
        </div>
      </div>
    </div>
  </div>


  <!-- =========================================================
       2. 체험자 스마트폰 모드 (QR 스캔 접속 화면)
  ========================================================== -->
  <div id="mobile-view" class="hidden w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
    <div class="bg-gradient-to-r from-indigo-600 to-violet-600 px-6 py-5 text-white text-center">
      <span class="text-xs font-semibold uppercase tracking-wider text-indigo-200">Sticker Booth Transfer</span>
      <h1 class="text-xl font-bold mt-1">스티커 사진 보내기</h1>
    </div>

    <div class="p-6 text-center">
      <div id="mobile-status-box" class="mb-6 p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-amber-800 text-sm font-medium flex items-center justify-center gap-2">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
        <span id="mobile-status-text">태블릿과 연결 중...</span>
      </div>

      <div id="mobile-upload-area" class="opacity-50 pointer-events-none transition-opacity">
        <label for="photo-input" class="block w-full cursor-pointer">
          <div class="border-2 border-dashed border-indigo-300 hover:border-indigo-500 bg-indigo-50/50 rounded-3xl p-8 transition flex flex-col items-center justify-center">
            <div class="w-16 h-16 rounded-full bg-indigo-600 text-white flex items-center justify-center text-3xl shadow-md mb-4">
              📸
            </div>
            <p class="text-base font-bold text-slate-800">여기를 눌러 사진 선택하기</p>
            <p class="text-xs text-slate-500 mt-1">앨범에서 사진 1장을 골라주세요</p>
          </div>
          <input id="photo-input" type="file" accept="image/*" class="hidden" />
        </label>
      </div>

      <div id="mobile-sent-area" class="hidden py-6">
        <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl mx-auto mb-3">
          ✅
        </div>
        <h2 class="text-lg font-bold text-slate-800">전송이 완료되었습니다!</h2>
        <p class="text-sm text-slate-600 mt-1 mb-6">태블릿 화면을 확인해 주세요.</p>

        <button id="btn-home" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3.5 px-5 rounded-2xl shadow-md transition">
          📱 부스 QR코드 스캔 화면으로 돌아가기
        </button>
      </div>

      <div class="mt-6 pt-4 border-t border-slate-100 text-center">
        <p class="text-xs font-bold text-slate-500">문원 AI디지털 교육연구회</p>
      </div>
    </div>
  </div>


  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetPeerId = urlParams.get('target');

    function playSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    // [모드 1] 태블릿
    if (!targetPeerId) {
      document.getElementById('tablet-view').classList.remove('hidden');

      let peer = null;
      let activeConn = null;
      let currentImageDataUrl = null;

      const badge = document.getElementById('connection-badge');
      const waitingSection = document.getElementById('tablet-waiting');
      const receivedSection = document.getElementById('tablet-received');
      const receivedImg = document.getElementById('received-image');

      function initTablet() {
        if (peer) peer.destroy();
        waitingSection.classList.remove('hidden');
        receivedSection.classList.add('hidden');
        badge.textContent = 'QR 생성 중...';

        peer = new Peer('booth-' + Math.random().toString(36).substring(2, 9));

        peer.on('open', (id) => {
          badge.textContent = '● 스캔 대기 중';
          badge.className = 'inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-400/25 text-emerald-100';

          const connectUrl = `${window.location.href.split('?')[0]}?target=${id}`;
          const qrContainer = document.getElementById('qrcode');
          qrContainer.innerHTML = '';
          new QRCode(qrContainer, {
            text: connectUrl,
            width: 240,
            height: 240,
            colorDark: '#1e1b4b',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
          });
        });

        peer.on('connection', (conn) => {
          activeConn = conn;
          badge.textContent = '📱 스마트폰 연결됨';

          conn.on('data', (payload) => {
            if (payload && payload.type === 'PHOTO' && payload.dataUrl) {
              currentImageDataUrl = payload.dataUrl;
              receivedImg.src = payload.dataUrl;
              waitingSection.classList.add('hidden');
              receivedSection.classList.remove('hidden');
              badge.textContent = '✅ 사진 수신 완료';
              playSound();
            }
          });
        });

        peer.on('error', () => {
          setTimeout(initTablet, 2000);
        });
      }

      document.getElementById('btn-download').addEventListener('click', () => {
        if (!currentImageDataUrl) return;
        const link = document.createElement('a');
        link.href = currentImageDataUrl;
        link.download = `sticker_${Date.now()}.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      document.getElementById('btn-next-photo').addEventListener('click', () => {
        receivedImg.src = '';
        currentImageDataUrl = null;
        initTablet();
      });

      initTablet();
    }
    // [모드 2] 스마트폰
    else {
      document.getElementById('mobile-view').classList.remove('hidden');

      const statusBox = document.getElementById('mobile-status-box');
      const statusText = document.getElementById('mobile-status-text');
      const uploadArea = document.getElementById('mobile-upload-area');
      const sentArea = document.getElementById('mobile-sent-area');
      const photoInput = document.getElementById('photo-input');

      const mobilePeer = new Peer();
      let conn = null;

      mobilePeer.on('open', () => {
        conn = mobilePeer.connect(targetPeerId, { reliable: true });

        conn.on('open', () => {
          statusBox.className = 'mb-6 p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm font-bold flex items-center justify-center gap-2';
          statusText.textContent = '태블릿과 연결되었습니다! 사진을 선택하세요';
          uploadArea.classList.remove('opacity-50', 'pointer-events-none');
        });

        conn.on('close', () => {
          statusBox.className = 'mb-6 p-3.5 rounded-2xl bg-slate-100 border border-slate-200 text-slate-600 text-sm font-medium flex items-center justify-center gap-2';
          statusText.textContent = '부스 세션이 종료되었습니다.';
          uploadArea.classList.add('opacity-50', 'pointer-events-none');
        });
      });

      photoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file || !conn || !conn.open) return;

        statusText.textContent = '사진을 전송하는 중...';

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 1600;
            let width = img.width;
            let height = img.height;

            if (width > height && width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            } else if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }

            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);

            conn.send({
              type: 'PHOTO',
              name: file.name,
              dataUrl: canvas.toDataURL('image/jpeg', 0.92)
            });

            uploadArea.classList.add('hidden');
            sentArea.classList.remove('hidden');
            statusBox.classList.add('hidden');
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('btn-home').addEventListener('click', () => {
        window.location.href = window.location.href.split('?')[0];
      });
    }
  </script>
</body>
</html>
